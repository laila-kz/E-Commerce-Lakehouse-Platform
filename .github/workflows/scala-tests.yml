name: Scala Catalyst Extension Tests

on:
  push:
    branches: [ audit-remediation ]
  pull_request:

jobs:
  scala-tests:
    name: Catalyst optimizer sbt test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run Scala extension tests
        working-directory: ./extensions/catalyst_optimizer
        run: sbt test
