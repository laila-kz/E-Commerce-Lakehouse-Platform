name: Silver Transform Tests

on:
  push:
    branches: [ audit-remediation ]
  pull_request:

jobs:
  silver-tests:
    name: Silver dedup & MERGE verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Spark, Delta and pytest
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.0 delta-spark==3.1.0 pytest duckdb pyyaml boto3 tenacity

      - name: Run Silver tests
        run: pytest tests -q
