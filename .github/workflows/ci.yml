name: CI Data Pipeline & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-code:
    name: 🐍 Python Linting (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 Code Formatting Check
        run: |
          flake8 .

  dbt-check:
    name: 📊 dbt Parse & Compile (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-duckdb
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Validate dbt Models & Compilation
        working-directory: ./dbt
        run: |
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .

  quality-gate-check:
    name: 🛡️ Pipeline Integrity & Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python Script Compilation
        run: |
          python -m py_compile checks/run_quality_gate.py
          python -m py_compile ingestion/kaggle_ingest.py
          python -m py_compile spark_jobs/bronze_transform.py
          python -m py_compile spark_jobs/silver_transform.py
          python -m py_compile airflow/plugins/slack_alert.py
          python -m py_compile airflow/dags/lakehouse_pipeline.py

  test-contract-and-reconciliation:
    name: 📜 Contract Gate & Reconciliation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install contract/reconciliation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml duckdb pytest

      - name: Run contract & reconciliation tests
        run: |
          python -m pytest tests/test_contract_cli.py tests/test_reconciliation.py -q

  # ── 3D Lineage Graph → GitHub Pages ─────────────────────────────────────
  publish-lineage-graph:
    name: 🌐 Build & Publish 3D Lineage Graph
    runs-on: ubuntu-latest
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name != 'pull_request'
    needs: [ dbt-check, quality-gate-check, test-contract-and-reconciliation ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-duckdb (to compile manifest.json)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Compile dbt to produce manifest.json
        working-directory: ./dbt
        # If dbt compile fails (e.g. no DuckDB data), fall through to static fallback
        run: |
          dbt parse --profiles-dir . || true
          dbt compile --profiles-dir . || true

      - name: Generate graph_data.json
        # Uses manifest.json if produced above, otherwise static fallback
        run: python scripts/generate_graph.py --manifest dbt/target/manifest.json --out docs/graph_data.json

      - name: Verify output
        run: |
          echo "=== graph_data.json summary ==="
          python -c "
          import json
          with open('docs/graph_data.json') as f:
              g = json.load(f)
          m = g['meta']
          print(f'Nodes : {m[\"node_count\"]}')
          print(f'Edges : {m[\"link_count\"]}')
          print(f'Layers: {m[\"layer_counts\"]}')
          print(f'Source: {m[\"source\"]}')
          "

      - name: Deploy docs/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "chore: update 3D lineage graph [skip ci]"
