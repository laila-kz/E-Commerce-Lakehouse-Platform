name: CI Data Pipeline & Quality Gate

on:
  push:
    branches: [ main, audit-remediation ]
  pull_request:
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-code:
    name: 🐍 Python Linting (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 Code Formatting Check
        run: |
          flake8 .

  python-syntax:
    name: 🧩 Python Syntax Check (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile every Python source tree
        run: |
          python -m compileall -q ingestion spark_jobs checks contracts scripts airflow soda tests

  dbt-check:
    name: 📊 dbt Parse & Compile (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-duckdb
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Validate dbt Models & Compilation
        working-directory: ./dbt
        run: |
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .

  unit-tests:
    name: 📜 Contract, Reconciliation & Ingest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml duckdb pytest boto3 tenacity

      - name: Run contract, reconciliation & ingest tests
        run: |
          python -m pytest tests/test_contract_cli.py tests/test_reconciliation.py tests/test_ingest_marker.py -q

  spark-tests:
    name: ⚡ Spark & Delta Recovery Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Spark, Delta and pytest
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.0 delta-spark==3.1.0 pytest duckdb pyyaml boto3 tenacity

      - name: Run Silver dedup, MERGE & crash-recovery tests
        run: |
          python -m pytest tests/test_silver_dedup.py tests/test_failure_recovery_silver.py -q

  scala-tests:
    name: 🔧 Scala Catalyst Extension Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run Scala extension tests
        working-directory: ./extensions/catalyst_optimizer
        run: sbt test

  # ── 3D Lineage Graph → GitHub Pages ─────────────────────────────────────
  publish-lineage-graph:
    name: 🌐 Build & Publish 3D Lineage Graph
    runs-on: ubuntu-latest
    # Deploy only from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ lint-code, python-syntax, dbt-check, unit-tests, spark-tests, scala-tests ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-duckdb (to compile manifest.json)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Compile dbt to produce manifest.json
        working-directory: ./dbt
        # If dbt compile fails (e.g. no DuckDB data), fall through to static fallback
        run: |
          dbt parse --profiles-dir . || true
          dbt compile --profiles-dir . || true

      - name: Generate graph_data.json
        # Uses manifest.json if produced above, otherwise static fallback
        run: python scripts/generate_graph.py --manifest dbt/target/manifest.json --out docs/graph_data.json

      - name: Verify output
        run: |
          echo "=== graph_data.json summary ==="
          python -c "
          import json
          with open('docs/graph_data.json') as f:
              g = json.load(f)
          m = g['meta']
          print(f'Nodes : {m[\"node_count\"]}')
          print(f'Edges : {m[\"link_count\"]}')
          print(f'Layers: {m[\"layer_counts\"]}')
          print(f'Source: {m[\"source\"]}')
          "

      - name: Deploy docs/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "chore: update 3D lineage graph [skip ci]"
