version: 2

models:
  - name: stg_events
    description: "Staging model for Silver clickstream event data. 1:1 view over Silver source with standardized columns."
    columns:
      - name: event_key
        description: "Deterministic SHA-256 synthetic deduplication key"
        tests:
          - not_null
          - unique

      - name: user_id
        description: "Unique user identifier"
        tests:
          - not_null

      - name: product_id
        description: "Unique product identifier"
        tests:
          - not_null

      - name: event_type
        description: "Clickstream event type (view, cart, remove_from_cart, purchase)"
        tests:
          - not_null
          - accepted_values:
              values: ['view', 'cart', 'remove_from_cart', 'purchase']

      - name: event_time
        description: "UTC timestamp when event occurred"
        tests:
          - not_null
