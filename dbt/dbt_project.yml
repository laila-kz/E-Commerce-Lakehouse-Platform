name: 'ecommerce_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_lakehouse:
    staging:
      +materialized: view
      +tags: ["staging", "s3_dependent"]
    intermediate:
      +materialized: view
      +tags: ["intermediate", "s3_dependent"]
    marts:
      +materialized: table
      +tags: ["marts", "offline_ready"]

tests:
  ecommerce_lakehouse:
    +tags: ["quality_gate", "test"]

